# Hosting template: replace wallet.example.com and certificate paths.
user nginx;
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 512k;
  limit_req_zone $binary_remote_addr zone=wallet_requests:10m rate=10r/s;
  server {
    listen 80;
    listen [::]:80;
    server_name wallet.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://wallet.example.com$request_uri; }
  }
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wallet.example.com;
    ssl_certificate /etc/letsencrypt/live/tensorcash-wallet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tensorcash-wallet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:WalletTLS:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    location / {
      limit_req zone=wallet_requests burst=30 nodelay;
      proxy_pass http://127.0.0.1:8790;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }
  }
}
