name: tensorcash-wallet-proxy
services:
  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: tensorcash-wallet-proxy
    network_mode: host
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/tensorcash-wallet:/etc/letsencrypt/live/tensorcash-wallet:ro
      - /etc/letsencrypt/archive/tensorcash-wallet:/etc/letsencrypt/archive/tensorcash-wallet:ro
      - ../.runtime/acme:/var/www/acme:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }
